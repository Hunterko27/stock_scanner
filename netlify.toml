[build]
  publish = "public"
  command = "npm install"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/scan"
  to = "/.netlify/functions/scan"
  status = 200

[[redirects]]
  from = "/api/lists"
  to = "/.netlify/functions/lists"
  status = 200

[[redirects]]
  from = "/api/earnings"
  to = "/.netlify/functions/earnings"
  status = 200

[[redirects]]
  from = "/api/pe"
  to = "/.netlify/functions/pe-ratio"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
